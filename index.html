dicek melalui sumber resmi pada 9 November 2026. Dokumen tool dapat berubah; verifikasi kembali versi, fitur dan izin sebelum implementasi. Sumber di bawah mendukung konsep tertentu, bukan menyatakan bahwa target internal program adalah standar industri."},{type:"heading",text:"R1  HumanSignal Label Studio Documentation"},{type:"paragraph",text:"https://labelstud.io/guide/"},{type:"paragraph",text:"Alur impor, konfigurasi, labeling dan ekspor; M04\u2013M06 menggunakan prinsip annotation umum."},{type:"heading",text:"R2  NIST AI Risk Management Framework"},{type:"paragraph",text:"https://www.nist.gov/itl/ai-risk-management-framework"},{type:"paragraph",text:"Kerangka sukarela untuk pertimbangan risiko AI; bukan rubrik sertifikasi trainer atau aturan hukum."},{type:"heading",text:"R3  Hugging Face TRL Dataset formats and types"},{type:"paragraph",text:"https://huggingface.co/docs/trl/dataset_formats"},{type:"paragraph",text:"Perbedaan format dan tipe dataset; contoh program disederhanakan untuk pembelajaran."},{type:"heading",text:"R4  Hugging Face TRL DPO Trainer"},{type:"paragraph",text:"https://huggingface.co/docs/trl/dpo_trainer"},{type:"paragraph",text:"Konteks preference optimization; program tidak menjalankan fine tuning model produksi."},{type:"heading",text:"R5  scikit learn Cohen kappa score"},{type:"paragraph",text:"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.cohen_kappa_score.html"},{type:"paragraph",text:"Definisi agreement yang memperhitungkan distribusi label."},{type:"heading",text:"R6  JiWER Documentation"},{type:"paragraph",text:"https://jitsi.github.io/jiwer/"},{type:"paragraph",text:"Pengukuran error transkripsi berbasis edit distance."},{type:"heading",text:"R7  HumanSignal Measuring inter annotator agreement"},{type:"paragraph",text:"https://labelstud.io/tutorials/how_to_measure_inter_annotator_agreement_and_build_human_consensus"},{type:"paragraph",text:"Pengukuran konsistensi dan workflow consensus."},{type:"heading",text:"R8  scikit learn F1 score"},{type:"paragraph",text:"https://scikit-learn.org/stable/modules/generated/sklearn.metrics.f1_score.html"},{type:"paragraph",text:"Definisi F1 dan pilihan agregasi."}]},{title:"46 Glosarium dan indeks toolkit",blocks:[{type:"table",rows:[["Istilah","Makna operasional"],["Annotation","Pemberian struktur, label atau penilaian pada data"],["Gold","Jawaban acuan yang telah direview dan diadjudikasi"],["Anchor","Contoh representatif untuk menyamakan interpretasi rubrik"],["Adjudication","Keputusan akhir atas perbedaan penilai oleh pihak berwenang"],["Holdout","Kasus disimpan untuk tes yang belum dilihat peserta"],["Source group","Kelompok data turunan dari sumber atau skenario yang sama"],["Evidence","Bukti spesifik yang menopang keputusan"],["Tie","Mutu respons setara menurut rubrik"],["Abstain","Keputusan ditahan karena bukti tidak cukup atau task tak dapat dinilai"],["SFT","Pembelajaran dari respons contoh yang diinginkan"],["RLHF","Pendekatan pembelajaran yang memanfaatkan feedback manusia"],["Readiness","Kesiapan pada scope, bahasa dan versi tertentu"]]},{type:"heading",text:"Isi paket kerja"},{type:"paragraph",text:"trainee: practice.csv, submission_template.csv dan guideline.md. mentor: calibration dan holdout, kunci P1, capstone_A dan capstone_B beserta gold, 40 task audit P3 dan kunci, 5 borderline, blueprint serta skrip audio. templates: competency_tracker.csv, project_review.csv, decision_log.csv, mentoring_log.csv, kpi_quarterly.csv, idp.csv dan survey.csv. tools: validate_submission.py dan score_submission.py. README menjelaskan urutan serta contoh perintah."},{type:"heading",text:"Batas kelengkapan yang perlu diselesaikan perusahaan"},{type:"paragraph",text:"P1 berisi data siap dipakai untuk mini simulasi. Gold tetap perlu disetujui QA sebelum ujian. P2 memerlukan rekaman dan gold audio aktual. P3 berisi 40 task audit dan 5 borderline siap direview. G3 berisi 60 pasangan terpisah dari latihan; perusahaan tetap wajib mengesahkan gold dan membuat pengganti jika task terpapar. Parameter biaya, kebutuhan proyek dan jumlah skill gap aktual diisi setelah baseline; dokumen tidak mengarang hasil audit perusahaan."}]}];var Tl=[{task_id:"P1-01-1",source_group:"refund_time",split:"practice",policy_text:"Dana refund kembali 3\u20135 hari kerja setelah disetujui.",user_prompt:"Berapa lama dana refund masuk?",response_a:"Pasti hari ini.",response_b:"Setelah disetujui, dana kembali 3\u20135 hari kerja.",guideline_version:"1.0"},{task_id:"P1-01-2",source_group:"refund_time",split:"practice",policy_text:"Dana refund kembali 3\u20135 hari kerja setelah disetujui.",user_prompt:"Mohon bantu: Berapa lama dana refund masuk?",response_a:"Setelah disetujui, dana kembali 3\u20135 hari kerja.",response_b:"Pasti hari ini.",guideline_version:"1.0"},{task_id:"P1-01-3",source_group:"refund_time",split:"practice",policy_text:"Dana refund kembali 3\u20135 hari kerja setelah disetujui.",user_prompt:"Berapa lama dana refund masuk? Mohon jelaskan sesuai kebijakan.",response_a:"Pasti hari ini.",response_b:"Setelah disetujui, dana kembali 3\u20135 hari kerja.",guideline_version:"1.0"},{task_id:"P1-02-1",source_group:"refund_receipt",split:"practice",policy_text:"Refund maksimal 7 hari dan wajib bukti pembelian.",user_prompt:"Saya beli 3 hari lalu, ingin refund.",response_a:"Boleh kirim bukti pembelian untuk diperiksa?",response_b:"Refund pasti disetujui tanpa pemeriksaan.",guideline_version:"1.0"},{task_id:"P1-02-2",source_group:"refund_receipt",split:"practice",policy_text:"Refund maksimal 7 hari dan wajib bukti pembelian.",user_prompt:"Mohon bantu: Saya beli 3 hari lalu, ingin refund.",response_a:"Refund pasti disetujui tanpa pemeriksaan.",response_b:"Boleh kirim bukti pembelian untuk diperiksa?",guideline_version:"1.0"},{task_id:"P1-02-3",source_group:"refund_receipt",split:"practice",policy_text:"Refund maksimal 7 hari dan wajib bukti pembelian.",user_prompt:"Saya beli 3 hari lalu, ingin refund. Mohon jelaskan sesuai kebij
