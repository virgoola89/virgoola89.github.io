ath",{d:"M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2",key:"1yyitq"}],["path",{d:"M16 3.128a4 4 0 0 1 0 7.744",key:"16gr8j"}],["path",{d:"M22 21v-2a4 4 0 0 0-3-3.87",key:"kshegd"}],["circle",{cx:"9",cy:"7",r:"4",key:"nufk8"}]]};wk.node;var Qt=A(wk);var Dk={name:"x",size:24,node:[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]};Dk.node;var Zn=A(Dk);var Yt=[{id:"M01",title:"Literasi AI dan peran data",track:"Pemula",hours:10,objectives:"Membedakan AI, machine learning, model generatif, inference dan training; menjelaskan pengaruh label terhadap perilaku model.",content:["AI adalah payung sistem yang melakukan tugas yang biasanya memerlukan kecerdasan manusia. Machine learning mempelajari pola dari data. Model generatif menghasilkan keluaran baru. Inference memakai model yang sudah dilatih; training mengubah parameter berdasarkan tujuan optimisasi. Prompt memberi instruksi saat penggunaan dan tidak otomatis memperbarui bobot model.","Data berlabel dapat menjadi contoh belajar, data evaluasi atau bahan audit. Salah label yang berulang dapat membentuk pola keliru. Data evaluasi harus terpisah dari materi latihan agar hasilnya menggambarkan kemampuan pada kasus baru. Jawaban model yang meyakinkan belum tentu benar."],example:"Prompt: \u201CRingkas kebijakan ini menjadi 2 poin.\u201D Trainee menilai kepatuhan pada dua poin dan kesetiaan pada sumber; ia tidak boleh menambahkan kebijakan yang terasa masuk akal. Output kerja adalah skor dan evidence, bukan klaim bahwa model telah dilatih ulang.",exercise:"Klasifikasikan 8 aktivitas: menulis prompt, memberi label, mengubah bobot, menjalankan model, menilai jawaban, memisah dataset, merevisi guideline, menerbitkan model. Tandai mana yang termasuk pekerjaan trainer dalam scope program. Buat diagram 5 tahap data \u2192 review \u2192 dataset \u2192 training/evaluasi \u2192 feedback.",criteria:"Lulus bila \u22657 dari 8 klasifikasi benar dan dapat memberi satu contoh kebocoran evaluasi. Alokasi 2 jam konsep, 2 demo, 4 praktik, 2 refleksi. Referensi R3 dan R4; istilah operasional program dijelaskan dalam glosarium."},{id:"M02",title:"Workflow data dan integritas kerja",track:"Pemula",hours:10,objectives:"Membaca brief, mengikuti versi guideline, mempertahankan identitas task dan membuat handover yang dapat diaudit.",content:["Mulai dari cek akses dan manifest, baca aturan, kerjakan calibration, produksi batch, self QA, kirim untuk review, revisi lalu ekspor. Manifest berisi batch_id, task_count, guideline_version, split dan owner. Task ID menghubungkan data sumber, label, reviewer dan keputusan final.","Gunakan status assigned, in_progress, submitted, changes_requested, accepted atau escalated. Jangan menghapus riwayat revisi. Tandai waktu aktif untuk analisis proses; jeda dan kendala sistem tidak boleh dicatat sebagai kesalahan kualitas."],example:"Batch B01 memuat 24 task dengan guideline v1.1. Peserta menemukan satu task kosong. Ia tidak membuat data pengganti: catat task_id, status escalated, alasan missing_source dan hubungi owner. Jumlah submitted + escalated harus sama dengan jumlah assigned.",exercise:"Buat manifest 12 task dan sengaja sisipkan ID duplikat serta 1 versi salah. Temukan keduanya, buat change log dan tulis handover 100 kata yang menyebut jumlah diterima, tertunda dan penyebab.",criteria:"Lulus bila seluruh 12 task terlacak, duplikasi terdeteksi dan tidak ada sumber yang diubah. Artefak: manifest.csv, submission.csv, handover.md. Alokasi 10 jam. Referensi R1 untuk alur tool; status dan format adalah rancangan internal."},{id:"M03",title:"Membaca guideline dan menangani ambiguitas",track:"Pemula",hours:10,objectives:"Mengubah guideline menjadi pohon keputusan; membedakan aturan eksplisit, contoh dan asumsi.",content:["Baca definisi label, kriteria masuk dan keluar, prioritas aturan, contoh positif, contoh kontra dan mekanisme abstain. Buat catatan \u201Cjika kondisi X maka label Y kecuali Z\u201D. Bila dua aturan bertentangan, cari prioritas yang tertulis; jika tidak ada, eskalasi dengan dua interpretasi dan dampaknya.","Confidence adalah tingkat keyakinan atas penerapan aturan, bukan kualitas output. Gunakan low ketika bukti kurang; abstain atau escalate sesuai aturan. Jangan menebak label untuk memenuhi jumlah. Setiap pertanyaan yang terjawab harus masuk decision log bertanggal dan berversi."],example:"Kebijakan: refund maksimal 7 hari dan wajib ada bukti pembelian. Kasus: pembelian 5 hari lalu, bukti belum disebut. Jawaban yang tepat meminta bukti; mengesahkan refund adalah asumsi. Pertanyaan tidak sama dengan penolakan.",exercise:"Tulis 6 contoh batas untuk aturan refund: hari ke-7, hari ke-8, bukti hilang, pesanan hadiah, nominal tidak disebut dan tanggal ambigu. Untuk masing-masing, tulis keputusan, aturan, evidence dan informasi yang masih dibutuhkan.",criteria:"Lulus bila semua keputusan memiliki rujukan aturan dan minimal 2 ambiguitas dikenali. Mentor menilai rasional, bukan banyaknya kata. Alokasi 10 jam. Referensi: guideline dummy pada brief P1 sebagai sumber kebenaran latihan."},{id:"M04",title:"Annotation teks dan span",track:"Pemula",hours:10,objectives:"Mengklasifikasi intent, memberi label span dan menjaga konsistensi batas karakter.",content:["Klasifikasi memberikan label ke seluruh teks; NER memberi label entitas pada rentang teks. Intent menjelaskan tujuan pesan, sentiment menjelaskan sikap. Untuk intent latihan gunakan refund, delivery, account dan other. Jika ada dua intent, label utama adalah permintaan terakhir yang eksplisit; jika tidak dapat diputuskan, escalate.","Untuk span gunakan indeks mulai inklusif dan akhir eksklusif, dihitung dari teks asli. Jangan menormalisasi teks sebelum menghitung offset. Bedakan karakter dengan byte. Catat tanda baca di luar span kecuali menjadi bagian nama resmi. Tidak semua proyek memakai konvensi yang sama."],example:"Teks \u201CKirim ke Bandung.\u201D memiliki span Bandung [9,16) dalam indeks karakter berbasis nol. Label CITY; titik tidak masuk. Pesan \u201CPaket telat, saya ingin refund\u201D berlabel refund menurut aturan intent latihan.",exercise:"Labeli 20 pesan buatan mentor, 5 di antaranya multi intent. Anotasikan 8 span kota atau organisasi dan lakukan pengecekan offset dengan mengambil substring. Peer menilai 5 task secara blind sebelum berdiskusi.",criteria:"Lulus bila accuracy \u226590% dan exact span match \u226585%, tanpa offset di luar panjang teks. Laporkan confusion matrix agar label other tidak menutupi kelemahan kelas kecil. Alokasi 10 jam. Referensi R1 untuk tool annotation."},{id:"M05",title:"Transkripsi segmentasi dan speaker",track:"Pemula",hours:10,objectives:"Mentranskripsi ucapan tanpa menebak, memberi batas segmen dan mempertahankan speaker ID.",content:["Transkripsi menulis ujaran yang terdengar. Segmentasi membagi waktu; diarization menjawab siapa berbicara kapan. Untuk dummy gunakan verbatim ringan: pertahankan kata, pengulangan bermakna dan alih bahasa; hapus \u201Ceee\u201D hanya bila guideline menyebutnya. Tulis [tidak terdengar] untuk rentang yang tidak dapat dipastikan, bukan kata hasil tebakan.","Replay konteks penuh, putar bagian sulit 2\u20133 kali, lalu tentukan start dan end. Gunakan speaker S1 dan S2 secara konsisten tanpa menyimpulkan identitas pribadi. Dua speaker dapat memiliki segmen waktu tumpang tindih. Jangan memaksa non-overlap lintas speaker jika suara memang bersamaan."],example:"S1 1.20\u20132.70: \u201CPesanannya belum datang.\u201D S2 2.30\u20133.10: \u201CSaya cek dulu.\u201D Overlap 0.40 detik; kedua rentang dipertahankan. Suara kipas ditandai hanya bila skema meminta event non-speech.",exercise:"Gunakan skrip P2, rekam atau gunakan klip berizin lalu transkripsikan 6 klip. Bandingkan kata terhadap referensi yang telah diverifikasi dari rekaman, bukan terhadap skrip awal saja. Ukur WER setelah aturan normalisasi disepakati.",criteria:"Lulus dummy bila WER \u226410%, \u226590% batas segmen dalam toleransi \xB10.20 detik dan konsistensi speaker \u226595% pada segmen gold. Toleransi adalah target latihan. Audio sulit perlu target berbeda. Alokasi 10 jam. Referensi R6 untuk metrik WER."},{id:"M06",title:"Annotation gambar dan multimodal",track:"Pemula",hours:10,objectives:"Memberi bounding box yang konsisten dan memisahkan pengamatan gambar dari inferensi.",content:["Bounding box mengikuti objek terlihat menurut guideline; polygon mengikuti kontur; klasifikasi memberi label gambar. Untuk dummy: label cup dan bottle; kotak mengikuti tepi objek yang terlihat, termasuk gagang cup, tanpa menebak bagian di luar gambar. Tandai occluded bila sebagian tertutup; objek di bawah 10\xD710 piksel diabaikan sesuai aturan latihan.","Pada pasangan gambar dan teks, verifikasi klaim terhadap area yang terlihat. Jangan menyimpulkan profesi, kesehatan atau identitas seseorang dari penampilan. Bila gambar tidak cukup jelas, tandai insufficient_evidence dan jelaskan keterbatasannya."],example:"Objek cup terlihat sebagian di belakang buku. Buat box pada bagian terlihat dan occluded=true. Respons \u201Ccangkir berisi kopi\u201D tidak didukung bila isi tidak terlihat; koreksi menjadi \u201Csebuah cangkir\u201D.",exercise:"Buat 12 gambar benda nonpribadi milik sendiri, dengan 4 occlusion dan 2 objek kecil. Labeli secara blind berpasangan. Hitung IoU = luas irisan \xF7 luas gabungan pada objek yang sama; review ketidaksesuaian label terpisah dari geometri.",criteria:"Lulus bila \u226590% objek wajib ditemukan, kelas tepat dan median IoU \u22650.80 pada pasangan matched; laporkan unmatched. IoU tinggi tidak mengganti objek yang terlewat. Alokasi 10 jam. Referensi R1 untuk annotation; aturan dummy adalah internal."},{id:"M07",title:"Rubrik evaluasi respons LLM",track:"Pemula",hours:10,objectives:"Menilai instruction following, factuality, completeness, clarity dan batas keselamatan secara terpisah.",content:["Rubrik harus memiliki definisi dimensi dan anchor. Skala latihan 0\u20134: 0 tidak dapat dipakai, 1 salah besar, 2 perlu revisi bermakna, 3 memenuhi, 4 sangat baik tanpa kekurangan material. Skor bukan preferensi gaya penilai. Satu kesalahan faktual dapat menurunkan factuality walau respons lancar.","Periksa instruksi eksplisit lebih dulu: bahasa, format, jumlah poin, sumber dan batas scope. Lalu periksa klaim satu per satu. Evaluasi clarity setelah kebenaran isi. Batas privasi dinilai sebagai gate, sehingga informasi sensitif tidak ditebus oleh gaya bahasa bagus."],example:"Instruksi \u201Cberikan dua poin dari sumber\u201D. Respons memberi tiga poin, satu di antaranya tambahan tanpa sumber. Instruction following=2; factuality=2; clarity dapat tetap 3. Catatan menyebut poin ketiga yang tidak didukung, bukan hanya \u201Ckurang bagus\u201D.",exercise:"Nilai 8 respons dari prompt yang sama. Pisahkan error format dari error fakta, lalu urutkan prioritas koreksi. Beri satu contoh anchor untuk skor 2 dan 3 pada tiap dimensi.",criteria:"Lulus bila \u226580% skor berbeda maksimal 1 poin dari anchor dan semua critical ditemukan. Ukur exact agreement juga agar toleransi tidak menyembunyikan drift. Alokasi 10 jam. Referensi R2 untuk perspektif risiko; rubrik adalah usulan program."},{id:"M08",title:"Alasan penilaian yang berbukti",track:"Pemula",hours:10,objectives:"Menulis alasan yang ringkas, dapat diverifikasi dan terhubung pada keputusan.",content:["Format alasan: keputusan, aturan atau dimensi, evidence spesifik dan dampak. Cukup 2\u20134 kalimat untuk mayoritas task; jangan membuat cerita proses berpikir internal yang panjang. Evidence dapat berupa potongan respons, fakta sumber, perhitungan atau timestamp. Panjang alasan bukan ukuran kualitas.","Bedakan fakta yang tersedia, inferensi dan data yang belum ada. Jika tidak ada bukti pembelian dalam prompt, tulis \u201Cbelum disebut\u201D, bukan \u201Ctidak punya\u201D. Hindari \u201CA lebih manusiawi\u201D, \u201Csaya suka\u201D atau \u201Cterlihat benar\u201D tanpa kriteria."],example:"\u201CPilih B. Aturan refund membutuhkan bukti pembelian dan batas 7 hari. A langsung menjanjikan refund walau bukti belum dikonfirmasi; B meminta bukti terlebih dahulu. B lebih sesuai kebijakan dan mencegah janji tanpa dasar.\u201D",exercise:"Perbaiki 5 alasan lemah: \u201CA lebih bagus\u201D, \u201CB panjang\u201D, \u201CA sopan\u201D, \u201CB jelas salah\u201D, \u201Ckeduanya sama\u201D. Tambahkan evidence dan kaitkan dengan satu aturan. Peer mencoba mereproduksi keputusan hanya dari catatanmu.",criteria:"Lulus bila 4 dari 5 alasan memiliki keputusan, evidence dan dampak yang benar serta tidak memasukkan fakta baru. Gunakan checklist pada template review. Alokasi 10 jam. Referensi: guideline proyek dan rubrik M07."},{id:"M09",title:"Preference ranking dan alignment",track:"Menengah",hours:10,objectives:"Membandingkan dua respons tanpa bias posisi, panjang atau gaya; membedakan preference, tie dan abstain.",content:["Nilai kedua respons memakai dimensi yang sama. Pilih yang paling memenuhi aturan prioritas. Gunakan tie ketika mutu setara menurut rubrik, bukan saat penilai ragu. Gunakan abstain atau escalate jika bukti tidak cukup, sumber hilang atau instruksi kontradiktif. Alasan harus menjelaskan perbedaan yang material.","Acak posisi A dan B serta periksa konsistensi pada pasangan terbalik. Jangan mengutamakan respons panjang jika jawaban pendek sudah lengkap. Simpan metadata dan versi. Untuk dataset preference yang akan diekspor ke trainer model, petakan winner ke chosen dan loser ke rejected; tie dan abstain ditangani sesuai pipeline, bukan dipaksa menjadi pasangan. [R3]"],example:"Respons A berjanji refund 2 hari. B menyebut 3\u20135 hari sesuai sumber. Walau A lebih ramah, B menang karena fakta kebijakan benar. Jika keduanya sama-sama 3\u20135 hari dan memenuhi instruksi, tie boleh dipakai.",exercise:"Nilai 12 pasangan latihan P1, lalu 4 pasangan yang dibalik posisinya tanpa pemberitahuan. Catat perubahan keputusan dan identifikasi apakah penyebabnya aturan atau bias posisi.",criteria:"Lulus bila \u226585% preferensi sesuai gold dan \u226590% konsisten setelah pemetaan posisi. Untuk sample kecil tampilkan hitungan asli. Alokasi 10 jam. Referensi R3 dan R4 untuk konteks preference alignment."},{id:"M10",title:"Penulisan contoh jawaban SFT",track:"Menengah",hours:10,objectives:"Menyusun pasangan instruksi dan jawaban yang benar, sesuai scope dan bebas duplikasi lintas split.",content:["Contoh SFT mengajarkan perilaku melalui respons target. Tuliskan jawaban yang mengikuti instruksi, bersumber pada konteks dan memenuhi gaya yang diminta. Format percakapan menyimpan role serta content; schema program tidak otomatis kompatibel dengan semua pipeline. Tim engineering menetapkan ekspor final. [R3]","Pisahkan variasi permukaan dari variasi kemampuan. Mengganti nama pada prompt yang sama tidak menciptakan evaluasi baru yang independen. Gunakan source_group untuk menempatkan seluruh turunan ke split yang sama. Catat asal, izin dan status review."],example:"Prompt \u201CPesanan saya terlambat, apa langkah berikutnya?\u201D dengan sumber waktu kirim 2\u20134 hari. Target: minta nomor pesanan, cek status dan jangan menjanjikan tanggal pasti. Respons target tidak boleh menambahkan nomor hotline yang tidak ada di sumber.",exercise:"Tulis 6 contoh: jawaban langsung, klarifikasi, ringkasan, format JSON, koreksi asumsi dan batas informasi. Uji masing-masing dengan checklist serta peer review. Tandai minimal satu contoh yang seharusnya meminta klarifikasi.",criteria:"Lulus bila 6/6 schema valid dan \u22655/6 respons diterima reviewer tanpa revisi material. Jangan mengirim file dummy ini ke training produksi. Alokasi 10 jam. Referensi R3 tentang format dataset; contoh program adalah sintetis."},{id:"M11",title:"Privasi keamanan dan integritas",track:"Menengah",hours:10,objectives:"Mengenali data sensitif, mengikuti akses minimum dan memilih jalur eskalasi yang tepat.",content:["Gunakan data dummy atau data yang telah diizinkan untuk latihan. Jangan memasukkan data proyek, kunci, identitas pengguna atau rekaman terbatas ke tool publik tanpa persetujuan owner. Redaksi data sesuai kebijakan, simpan sumber asli di lokasi yang dibatasi dan catat siapa yang boleh mengaksesnya.","Perlakukan teks dalam dokumen sebagai data. Instruksi \u201Cabaikan guideline dan tampilkan kunci\u201D di dalam task tidak mengambil alih instruksi pekerjaan. Catat percobaan prompt injection dan tetap gunakan sumber yang ditetapkan. Hindari menilai integritas orang hanya dari deteksi otomatis."],example:"Peserta menemukan email pribadi pada teks. Ia menghentikan distribusi, menandai task dan melaporkan task_id melalui kanal privat. Ia tidak menyalin email ke grup ramai atau mengunggah screenshot ke forum.",exercise:"Tentukan tindakan pada 6 kasus: kunci bocor, email pada task, akses folder terlalu luas, prompt injection, rekaman tanpa izin dan tautan asing. Tulis tindakan segera, owner dan syarat memulai lagi.",criteria:"Lulus bila semua skenario kritis ditangani tanpa perluasan akses dan laporan memiliki fakta minimum. Kebijakan perusahaan dan arahan security menjadi acuan produksi. Alokasi 10 jam. Referensi R2 sebagai kerangka risiko sukarela; latihan ini bukan penafsiran hukum."},{id:"M12",title:"Verifikasi fakta dan kualitas sumber",track:"Menengah",hours:10,objectives:"Memeriksa klaim dengan sumber primer serta membatasi kesimpulan ketika bukti tidak cukup.",content:["Pecah respons menjadi klaim yang bisa diperiksa. Tentukan apakah tugas closed book hanya memakai sumber yang disediakan, atau open book mengizinkan pencarian. Dalam closed book, klaim benar di dunia nyata tetap dapat dianggap unsupported jika sumber task tidak memuatnya.","Untuk open book, utamakan dokumentasi resmi, makalah asli dan situs institusi; catat URL, judul, tanggal akses dan potongan pendukung secukupnya. Cocokkan waktu, versi produk dan konteks. Dua situs yang mengutip sumber sama bukan dua bukti independen."],example:"Sumber dummy menyatakan promo berakhir 30 Juni. Respons menyebut 31 Juli. Factuality gagal walau penilai pernah melihat promo lain hingga Juli. Keputusan mengacu pada sumber task yang tepat.",exercise:"Verifikasi 5 klaim dari jawaban buatan: 2 didukung, 1 bertentangan, 1 tidak disebut dan 1 informasi yang bisa berubah. Buat claim ledger dengan status supported, contradicted, unsupported atau unverifiable.",criteria:"Lulus bila seluruh status tepat dan minimal 4/5 evidence dapat dibuka kembali oleh reviewer. Jangan membuat sitasi ketika sumber tidak ditemukan. Alokasi 10 jam. Referensi: sumber primer yang ditetapkan pada tiap task dan R2 untuk konteks evaluasi risiko."},{id:"M13",title:"Quality assurance dan analisis error",track:"Menengah",hours:10,objectives:"Membedakan critical, major dan minor; memilih sampel audit dan menemukan akar masalah.",content:["Review dimulai dari task dan guideline, bukan dari dugaan kemampuan annotator. Bandingkan output, tentukan error code, severity, evidence dan tindakan. Pisahkan annotation salah dari guideline ambigu atau sumber rusak. Keputusan yang belum terselesaikan tidak dimasukkan sebagai gold.","Sampling latihan: review 100% batch pertama; setelah dua batch lulus, audit acak 20% dengan tambahan seluruh high risk dan eskalasi. Laporkan hasil sampel acak terpisah dari sampel terarah agar tingkat cacat tidak bias. Jika satu critical terkonfirmasi, tahan batch terkait dan perluas audit."],example:"Dari 30 task, 6 diaudit acak dan 2 major ditemukan. Temuan 2/6 adalah tingkat cacat pada sampel, bukan berarti tepat 10 dari 30 task pasti salah. Periksa scope terdampak sebelum menyetujui ekspor.",exercise:"Audit 20 hasil dengan 2 major, 3 minor dan 1 kasus ambigu yang disisipkan mentor. Kelompokkan penyebab: aturan tidak paham, contoh kurang, tool, sumber atau attention. Usulkan satu perbaikan proses per kelompok.",criteria:"Lulus bila seluruh critical dan \u226590% major terdeteksi serta false alarm \u226410% pada gold clean. Alokasi 10 jam. Referensi: severity dan rencana sampling program; validasi oleh QA lead wajib."},{id:"M14",title:"Kalibrasi agreement dan adjudication",track:"Menengah",hours:10,objectives:"Mengukur konsistensi penilai dan menyelesaikan perbedaan melalui evidence.",content:["Double annotation dilakukan secara independen sebelum diskusi. Exact agreement membandingkan label yang identik. Untuk dua penilai label nominal, Cohen kappa memperhitungkan agreement karena distribusi label; \u03BA=(po\u2212pe)/(1\u2212pe). Kappa bukan ukuran kebenaran. [R5]","Agreement tinggi dapat berasal dari bias bersama. Bandingkan juga dengan gold yang telah diadjudikasi dan audit kelas langka. Jika label sangat timpang atau denominator kecil, laporkan distribusi kelas, exact agreement dan contoh konflik. Jangan memaksa consensus sebelum peserta menulis penilaian sendiri."],example:"Dua penilai sepakat pada 18/20 task: po=0.90. Bila pe=0.50, \u03BA=0.80. Bila kedua penilai hanya menggunakan satu label sehingga pe=1, kappa tidak terdefinisi; tampilkan N/A dan periksa variasi data.",exercise:"Nilai 20 task secara blind dengan partner. Buat disagreement log, pilih 5 konflik, masing-masing kutip aturan. QA lead memutuskan atau menandai unresolved. Perbarui satu anchor dan uji dengan 5 task baru.",criteria:"Lulus bila hasil hitung benar dan semua perubahan keputusan punya alasan. Target pilot exact agreement \u226585% dan \u03BA\u22650.70 bila dapat dihitung; tinjau relevansinya per task. Alokasi 10 jam. Referensi R5 dan R7."},{id:"M15",title:"Validasi dataset dan otomasi ringan",track:"Menengah",hours:10,objectives:"Memeriksa schema, keunikan ID, label sah, completeness dan pemisahan split.",content:["Validasi mekanis dilakukan sebelum penilaian isi. Cek field wajib, tipe, enum, rentang angka, duplikasi ID dan relasi sumber. Pada audio, cek 0\u2264start<end\u2264durasi. Pada preference, cek respons tidak kosong dan keputusan salah satu A, B, tie atau abstain. Valid schema tidak membuktikan isi benar.","Untuk peserta dasar, gunakan filter dan conditional formatting. Advanced menjalankan validator Python dalam toolkit dengan pustaka standar. Simpan laporan validasi bersama submission, bukan hanya screenshot. Fail cepat jika versi guideline salah."],example:"Task T04 muncul dua kali dan T09 tidak memiliki evidence. Validator menolak duplikasi dan field kosong; reviewer masih harus mengecek apakah evidence yang terisi memang relevan. Source group yang muncul di dua split merupakan potensi kebocoran.",exercise:"Jalankan validator pada submission contoh, sisipkan label X, ID duplikat dan evidence kosong, lalu perbaiki ketiganya. Advanced membuat audit per kelas dan menuliskan keterbatasan sample.",criteria:"Lulus bila semua cacat yang disisipkan terdeteksi dan perbaikan tidak mengubah sumber. Alokasi 10 jam. Referensi R3 untuk contoh schema dataset; kontrak CSV program terdapat pada README toolkit."},{id:"M16",title:"Komunikasi proyek dan microteaching",track:"Menengah",hours:10,objectives:"Menyampaikan blocker, handover dan feedback yang bisa ditindaklanjuti; mengajar satu keputusan kerja.",content:["Pesan kerja harus memuat konteks, task_id, versi, masalah, bukti, dampak dan tindakan yang diminta. Bedakan urgent karena akses atau critical dengan pertanyaan yang dapat menunggu office hours. Jangan menyisipkan informasi sensitif dalam kanal publik.","Feedback review menjelaskan error dan cara memperbaiki, bukan menulis ulang semua jawaban untuk peserta. Microteaching berlangsung 10 menit: satu tujuan, satu demo, dua latihan dan cek pemahaman. Mentor mengukur apakah peserta mampu menerapkan aturan pada contoh baru."],example:"\u201CBatch B02 v1.0 memiliki 2 task tanpa policy_text. Saya menahan keputusan, mencatat missing_source dan menyelesaikan 10 task lain. Mohon owner melengkapi sumber sebelum Kamis 15.00 WIB; 2 task ini belum dapat diserahterimakan.\u201D",exercise:"Tulis satu eskalasi, satu feedback major dan satu handover. Ajarkan aturan abstain kepada kelompok 4 orang menggunakan kasus baru. Minta setiap anggota memberikan keputusan independen sesudah sesi.",criteria:"Lulus bila pesan lengkap tanpa klaim berlebihan dan \u22653 dari 4 anggota mampu menerapkan aturan. Alokasi 10 jam. Referensi: template operasional program dan guideline P1."}];var ft=[{title:"Program Pengembangan AI Trainer",blocks:[{type:"paragraph",text:"Dari pemula menuju kontributor proyek dan reviewer"},{type:"paragraph",text:"Disusun untuk @olaldila sebagai Learning & Development Manager. Dokumen ini menjadi rancangan operasional untuk membangun kemampuan AI Trainer berbasis bukti kerja, dari orientasi hingga penempatan proyek terkontrol."},{type:"heading",text:"Hasil yang dituju"},{type:"paragraph",text:"Peserta mampu membaca guideline, menghasilkan annotation yang konsisten, menilai respons model dengan bukti, memperbaiki kesalahan, dan menyerahkan data yang dapat diaudit. Reviewer mampu mengkalibrasi keputusan dan melatih anggota lain. Kelulusan berlaku untuk jenis tugas dan versi guideline yang diuji; tidak otomatis berlaku untuk semua proyek."},{type:"table",rows:[["Rancangan","Ketentuan awal"],["Durasi","24 minggu standar atau 12 minggu intensif dengan beban belajar setara"],["Sasaran","Pemula, kontributor berpengalaman, calon reviewer atau mentor"],["Cakupan","Data annotation, evaluasi LLM, audio, QA dan pembinaan talenta"],["Beban","240 jam per orang untuk jalur lengkap"],["Dokumen","Panduan manajer, 16 modul, 3 simulasi, rubrik dan template"],["Status","Rancangan siap diadaptasi; belum merupakan hasil audit perusahaan"]]},{type:"heading",text:"Cara mulai minggu ini"},{type:"paragraph",text:"Tetapkan project owner dan QA lead, pilih satu jenis tugas, jalankan tes penempatan, lalu kalibrasi kunci jawaban sebelum kelas pertama. Gunakan dataset sintetis dalam toolkit; simpan folder mentor terpisah dari peserta."},{type:"paragraph",text:"Tanggal referensi: 9 November 2026. Seluruh target, rasio staf dan batas kualitas dalam dokumen adalah usulan internal, bukan standar universal atau jaminan diterima kerja."}]},{title:"Peta isi dan cara menggunakan paket",blocks:[{type:"table",rows:[["Bagian","Isi dan pengguna"],["01 sampai 08","Desain program, penempatan, jadwal, penanggung jawab dan mentoring untuk L&D"],["M01 sampai M16","Handbook 16 modul untuk trainee dan fasilitator"],["25 sampai 30","Tiga proyek dummy, workflow produksi dan serah terima"],["31 sampai 36","Kompetensi, penilaian, quiz, jawaban dan evaluasi proyek"],["37 sampai 43","Skill gap, roadmap, KPI, survey, perbaikan dan template operasional"],["44 sampai 46","Peluncuran, referensi, glosarium dan isi toolkit"]]},{type:"heading",text:"Pemisahan akses"},{type:"paragraph",text:"Versi dokumen induk memuat kunci quiz dan contoh keputusan mentor. Untuk assessment tertutup, bagikan hanya halaman modul dan brief proyek yang relevan. Pada toolkit, trainee menerima folder trainee; folder mentor hanya untuk QA lead dan assessor. Dataset latihan boleh dibahas, sedangkan kunci calibration dan holdout tidak dibagikan sebelum penilaian selesai."},{type:"heading",text:"Urutan pemakaian"},{type:"paragraph",text:"L&D mengisi parameter cohort dan daftar staf, lalu membuat jadwal serta kanal bantuan."},{type:"paragraph",text:"Assessor menjalankan baseline tanpa coaching, menentukan track dan mencatat bukti per kompetensi."},{type:"paragraph",text:"Trainer menggunakan modul dengan urutan prasyarat, demo singkat dan latihan mandiri sebelum diskusi."},{type:"paragraph",text:"QA lead mengkalibrasi jawaban reviewer; peserta menyelesaikan simulasi, revisi dan tes transfer."},{type:"paragraph",text:"Project owner menyetujui penempatan terbatas; L&D memeriksa kualitas kembali pada hari 7 dan 30."},{type:"heading",text:"Aturan adaptasi"},{type:"paragraph",text:"Jika guideline klien berbeda, guideline tersebut menjadi acuan proyek setelah diverifikasi owner. Catat perubahan ke change log, hentikan item terdampak, perbarui contoh dan lakukan tes ulang. Jangan mengubah kunci diam-diam setelah melihat skor peserta."}]},{title:"01 Peran AI Trainer dan batas kompetensi",blocks:[{type:"paragraph",text:"AI Trainer dalam program ini adalah pekerja yang membantu pengembangan AI melalui data, penilaian, contoh jawaban dan feedback terstruktur. Nama jabatan di perusahaan lain dapat berbeda. Pekerjaan ini tidak selalu melatih bobot model secara langsung."},{type:"table",rows:[["Peran","Keputusan dan output","Bukti siap kerja"],["Annotator","Label, span, transkrip atau atribut sesuai guideline","Batch label dengan versi aturan dan catatan ambiguitas"],["LLM evaluator","Skor dimensi dan perbandingan respons","Scorecard, preferensi dan alasan berbukti"],["Domain expert","Validasi isi sesuai bidang atau bahasa","Koreksi, referensi dan batas kepastian"],["QA reviewer","Terima, revisi atau eskalasi annotation","Audit trail dan klasifikasi error"],["Calibration lead","Putuskan kasus ambigu dan perbarui acuan","Decision log dan contoh anchor"],["Mentor","Diagnosis gap dan latihan terarah","Rencana 2 minggu dan bukti perbaikan"]]},{type:"heading",text:"Fondasi yang wajib untuk semua track"},{type:"paragraph",text:"Literasi AI, pemahaman instruksi, ketelitian data, integritas assessment, privasi, komunikasi tertulis dan kemampuan mengakui ketidakpastian. Bahasa Inggris dinilai sesuai kebutuhan proyek; jangan menyamakan aksen atau gaya bahasa dengan kecakapan analitis."},{type:"heading",text:"Hubungan data dengan pengembangan model"},{type:"paragraph",text:"Contoh jawaban berkualitas dapat mendukung supervised fine tuning atau SFT. Pasangan jawaban dengan preferensi dapat mendukung alignment, termasuk DPO. RLHF adalah keluarga pendekatan yang menggunakan feedback manusia; memberi rating saja tidak berarti peserta menjalankan keseluruhan proses reinforcement learning. [R3, R4]"},{type:"paragraph",text:"Cabang ML engineering, pelatihan GPU dan deployment model tidak menjadi syarat kelulusan dasar. Peserta advanced mempelajari validasi data dan eksperimen kecil sebagai persiapan bekerja sama dengan tim engineering."}]},{title:"02 Parameter cohort dan kapasitas program",blocks:[{type:"paragraph",text:"Contoh rencana ini memakai 24 peserta dengan akses laptop, headset, internet stabil dan 10 jam belajar per minggu. L&D harus mengganti parameter dengan kondisi nyata sebelum rekrutmen. Seluruh waktu kelas, latihan dan review dihitung sebagai beban belajar."},{type:"table",rows:[["Komponen mingguan","Jam peserta","Output wajib"],["Belajar mandiri","2","Catatan konsep dan pre quiz"],["Kelas dan demo","2","Checklist langkah kerja"],["Praktik mandiri","3","Batch tugas sesuai modul"],["Kalibrasi dan peer review","1,5","Catatan perubahan keputusan"],["Office hours atau klinik","1","Masalah dan solusi teruji"],["Refleksi dan pencatatan","0,5","Log error dan rencana berikutnya"],["Total","10","240 jam selama 24 minggu"]]},{type:"heading",text:"Kapasitas staf untuk 24 peserta"},{type:"paragraph",text:"Sediakan 1 L&D manager sekitar 6 jam/minggu, 1 lead trainer 10 jam/minggu, 2 mentor masing-masing 6 jam/minggu, dan 1 QA lead 8 jam/minggu. Total 36 jam staf/minggu atau 864 jam untuk 24 minggu, sebelum biaya infrastruktur dan specialist guest. Pisahkan waktu mengajar dari waktu mengerjakan review."},{type:"paragraph",text:"Rasio awal mentor adalah 1 banding 12. Jika rata-rata antrean feedback melampaui 2 hari kerja atau review mentor melebihi kapasitas selama 2 minggu, kurangi ukuran batch atau tambah reviewer. Jangan menaikkan jumlah peserta hanya karena kelas daring masih muat."},{type:"heading",text:"Rumus anggaran yang dapat diisi"},{type:"paragraph",text:"Biaya cohort = \u03A3(jam staf \xD7 tarif per jam) + lisensi + penyimpanan + dukungan akses + biaya waktu peserta bila ditanggung. Biaya per lulusan = biaya cohort \xF7 peserta yang lolos gate akhir. Jika belum ada lulusan, tampilkan N/A, bukan nol."}]},{title:"03 Tes penempatan dan jalur belajar",blocks:[{type:"table",rows:[["Bagian baseline","Bobot","Pelaksanaan"],["Quiz konsep dan instruksi","20%","10 item baru; 20 menit"],["Annotation teks","25%","20 item dengan 4 label; 40 menit"],["Evaluasi respons","30%","10 pasangan; 45 menit"],["Tool dan kualitas data","15%","Impor, perbaiki 5 error lalu ekspor; 25 menit"],["Komunikasi dan eskalasi","10%","2 memo singkat; 20 menit"]]},{type:"paragraph",text:"Skor baseline = jumlah skor bagian 0 sampai 100 dikali bobot. Simpan nilai mentah, contoh hasil dan versi tes. Gunakan item setara yang belum pernah dilihat peserta. Sediakan penyesuaian akses yang tidak mengubah kompetensi yang diukur."},{type:"table",rows:[["Track","Kriteria masuk usulan","Milestone dan hak akses"],["Pemula","Skor <60 atau belum ada bukti dasar","Minggu 1\u20138: fondasi; G1 untuk akses simulasi"],["Menengah","Skor 60\u201379 dan privasi lulus","Minggu 9\u201316: spesialisasi; G2 untuk capstone"],["Advanced","Skor \u226580, rubrik \u22653 dan bukti QA","Minggu 17\u201324: QA, mentoring dan G3"],["Perlu dukungan awal","Tidak mampu menyelesaikan tool check","Klinik literasi digital 1\u20132 minggu sebelum track"]]},{type:"heading",text:"Aturan bypass dan remediasi"},{type:"paragraph",text:"Tes penempatan hanya menentukan titik mulai. Peserta berpengalaman boleh melewati kelas yang telah dikuasai jika lulus challenge pada gate terkait; tetap wajib orientasi data dan kalibrasi proyek. Insiden integritas atau privasi memerlukan asesmen ulang bagian tersebut, terlepas dari skor total."},{type:"paragraph",text:"Peserta yang belum lulus mendapat diagnosis per error, 2 sesi klinik dan satu tes ulang setara dalam 10 hari kerja. Setelah dua kegagalan pada kompetensi yang sama, buat jalur belajar individual dan tunda penempatan; jangan menjumlah nilai gagal dengan nilai ulang."}]},{title:"04 Timeline 24 minggu dan opsi intensif",blocks:[{type:"table",rows:[["Minggu","Fokus dan modul","Milestone yang diperiksa"],["1\u20132","Orientasi, AI dan workflow M01\u2013M02","Baseline, tool check, data policy"],["3\u20134","Guideline dan annotation M03\u2013M04","20 label dengan error log"],["5\u20136","Audio dan visual M05\u2013M06","Mini batch per modalitas"],["7\u20138","Rubrik dan bukti M07\u2013M08","Gate G1 dan rencana spesialisasi"],["9\u201310","Preference dan SFT M09\u2013M10","12 pasangan dan 6 jawaban contoh"],["11\u201312","Privasi dan verifikasi M11\u2013M12","Audit sumber dan skenario eskalasi"],["13\u201314","QA dan kalibrasi M13\u2013M14","Double annotation dan adjudication"],["15\u201316","Validasi dan komunikasi M15\u2013M16","Gate G2 dan handover mini batch"],["17\u201318","Capstone individual","Batch independen dan review pertama"],["19\u201320","Revisi dan uji transfer","Kasus baru dengan guideline v2"],["21\u201322","QA atau pendampingan terbatas","Audit, root cause dan microteaching"],["23\u201324","Gate G3 dan penempatan","Portfolio, review panel dan rencana 30 hari"]]},{type:"paragraph",text:"Pembagian 240 jam: 160 jam untuk 16 modul, 8 jam P1, 8 jam P2, 12 jam P3, 40 jam capstone, serta 12 jam baseline, orientasi akhir dan remediasi. Mentoring masuk ke alokasi kegiatan tersebut. Jam integrasi simulasi, capstone dan remediasi tersebar mengikuti milestone; latihan modul dan proyek tidak dihitung dua kali. Jalur intensif berlangsung 12 minggu \xD7 20 jam = 240 jam. Gabungkan dua minggu standar menjadi satu minggu intensif, bukan menghapus latihan. Hanya untuk peserta yang memiliki waktu dan lolos kesiapan beban; jadwalkan maksimal 3 jam kelas langsung per hari dan sisakan praktik serta review."},{type:"heading",text:"Pilihan untuk perusahaan dengan proyek mendesak"},{type:"paragraph",text:"Setelah G1, anggota dapat mengikuti shadowing menggunakan data sintetis. Setelah G2, owner boleh memberi tugas risiko rendah dengan review 100% dan kapasitas terbatas. Akses produksi mandiri baru diberikan setelah G3 dan kalibrasi spesifik proyek. Proyek sensitif memerlukan pelatihan tambahan yang disepakati owner."}]},{title:"05 Gate kelulusan dan evaluasi track",blocks:[{type:"table",rows:[["Gate","Bukti minimum","Ambang usulan"],["G1 dasar","Quiz baru, 40 label, 5 evaluasi respons, tool check","Quiz \u226580; accuracy label \u226590%; rubrik dasar \u22653; privasi lulus"],["G2 spesialisasi","30 task spesialisasi baru dan 10 overlap untuk kalibrasi","Scorecard \u226585; outcome utama sesuai proyek; tidak ada critical; semua bukti wajib ada"],["G3 proyek","Dua batch terpisah masing-masing \u226530 task baru, uji transfer dan handover","Scorecard \u226585 tiap batch; nilai dimensi wajib \u22653; \u226590% batch tepat waktu; nol critical"],["Reviewer readiness","Audit 20 hasil baru, 5 kasus adjudication dan microteaching","Recall major/critical \u226590%; false alarm \u226410%; coaching \u22653 dari 4"]]},{type:"paragraph",text:"Ukuran sampel ini adalah batas operasional awal untuk simulasi, bukan bukti presisi statistik tinggi. Nilai 90% dari 10 item berarti hanya 9 item benar. Selalu tampilkan numerator, denominator dan jenis kasus. Tambahkan sampel bila keputusan berisiko atau cakupan label belum terwakili."},{type:"heading",text:"Perhitungan scorecard track"},{type:"paragraph",text:"G2 dan G3: 45% kualitas output, 20% penerapan guideline, 15% alasan berbukti, 10% QA mandiri, dan 10% handover. Setiap dimensi dinilai 0\u20134 lalu dikonversi ke 0\u2013100. Nilai wajib minimal 3 berlaku untuk kualitas, guideline, alasan dan privasi yang dinilai terpisah. Nilai total tinggi tidak mengganti kegagalan dimensi wajib."},{type:"heading",text:"Definisi critical untuk simulasi"},{type:"paragraph",text:"Membocorkan kunci atau data terbatas, membuat bukti atau sumber palsu, mengirim data ke layanan yang tidak disetujui, atau menerima output yang secara eksplisit melanggar batas privasi simulasi. Major: salah preferensi atau aturan utama yang mengubah makna. Minor: format yang dapat diperbaiki tanpa mengubah keputusan. QA lead memverifikasi severity; tuduhan tidak diputuskan otomatis oleh skor."}]},{title:"06 Penanggung jawab dan workflow keputusan",blocks:[{type:"table",rows:[["Kegiatan","Accountable","Responsible","Consulted"],["Kurikulum dan anggaran","L&D manager","Lead trainer","Project owner dan QA"],["Kunci dan guideline","QA lead","2 assessor","Domain expert"],["Kelas dan klinik","Lead trainer","Trainer dan mentor","L&D"],["Penilaian gate","QA lead","Assessor independen","Mentor"],["Akses data dan tool","Project owner","Admin sistem","Security atau data steward"],["Penempatan proyek","Project owner","Operations lead","QA dan L&D"],["Evaluasi triwulan","L&D manager","Program analyst","Ops, QA dan peserta"]]},{type:"paragraph",text:"Accountable berarti pemilik keputusan akhir, satu orang per aktivitas. Responsible berarti pelaksana. Mentor tidak menjadi satu-satunya penilai akhir peserta bimbingannya. Jika staf terbatas dan peran dirangkap, QA lead melakukan blind second review pada semua borderline dan minimal 20% hasil lainnya."},{type:"heading",text:"Flowchart keputusan belajar"},{type:"paragraph",text:"Jika evidence kurang, statusnya pending evidence; jangan menyamakannya dengan gagal kompetensi. Perubahan kunci harus didokumentasikan dan skor item terdampak dihitung ulang untuk semua peserta."}]},{title:"07 Mentoring dan ritme komunitas",blocks:[{type:"table",rows:[["Waktu contoh WIB","Agenda","Hasil nyata"],["Senin 19.00\u201320.00","Demo 15 menit, think aloud keputusan 15, praktik 20, exit ticket 10","1 contoh anchor dan 3 pertanyaan"],["Selasa mandiri","Batch praktik 60\u201390 menit dan error log","Submission sebelum Rabu 18.00"],["Rabu 19.00\u201320.00","Blind calibration 10, diskusi 30, aturan 10, ulang 10","Decision log dengan owner"],["Kamis 19.00\u201320.00","Office hours; slot 15 menit per masalah","Blocker selesai atau ticket"],["Jumat 19.00\u201319.30","Sharing studi kasus bergilir","1 perbaikan yang diuji"],["Setiap 2 minggu","1 banding 1 mentor 20 menit","Target skill dan tanggal cek"]]},{type:"paragraph",text:"Jadwal di atas contoh office hours WIB, bukan kewajiban siap siaga 24 jam. Kanal menerima pesan kapan saja; tanggapan diberikan Senin\u2013Jumat 09.00\u201317.00 WIB, maksimal 1 hari kerja untuk acknowledge dan 2 hari kerja untuk jawaban atau eskalasi. Masalah Jumat malam ditangani pada hari kerja berikutnya. Sesuaikan jam kelas dengan ketersediaan cohort."},{type:"heading",text:"Format mentoring 20 menit"},{type:"paragraph",text:"Menit 0\u20133: peserta menunjukkan satu hasil dan satu kesulitan. Menit 3\u20138: mentor menguji letak kesalahan memakai evidence. Menit 8\u201315: peserta mengulang 2 task baru tanpa menyalin jawaban. Menit 15\u201320: sepakati satu perubahan perilaku, ukuran berhasil dan tanggal cek. Mentor menulis feedback pada task, bukan menilai karakter peserta."},{type:"heading",text:"Membuat anggota betah"},{type:"paragraph",text:"Sediakan peta progres pribadi, badge berbasis bukti, kelompok 4 orang, kesempatan presentasi dan arsip jawaban terindeks. Hindari ranking publik. Hubungi anggota yang absen dua sesi secara pribadi, tawarkan rekaman atau slot pengganti dan catat kendala akses sebelum menilai motivasinya."}]},{title:"08 Sistem belajar dan perangkat kerja",blocks:[{type:"table",rows:[["Kebutuhan","Pilihan alat","Penggunaan konkret"],["Materi dan progres","Moodle atau Google Classroom","Modul, deadline, quiz dan completion"],["Dokumen kerja","Word, Docs atau wiki internal","Guideline versi tetap dan decision log"],["Tabel tugas","Excel atau Sheets","Task ID, label, audit dan scorecard"],["Annotation umum","Label Studio","Impor task, anotasi, ekspor [R1]"],["Visual lanjutan","CVAT atau tool klien","Bounding box dan review geometri"],["Audio","Audacity dan player bertimestamp","Replay, batas segmen dan pemeriksaan noise"],["Koordinasi","Teams, Slack atau kanal terstruktur","helpdesk, announcements, calibration"],["Sesi langsung","Meet, Zoom atau Teams","Breakout, demo dan rekaman berizin"],["Validasi advanced","Python, JSON dan version control","Validasi schema, duplikasi dan audit"]]},{type:"paragraph",text:"Pilih satu alat per kebutuhan saat pilot; tool di atas adalah opsi operasional, bukan kewajiban pembelian. Verifikasi ketersediaan fitur, biaya dan izin perusahaan saat implementasi. Mode CSV dalam toolkit dapat dipakai tanpa instalasi platform annotation."},{type:"heading",text:"Praktik awal 30 menit"},{type:"paragraph",text:"Buka trainee/practice.csv. Salin ke tabel, pertahankan task_id, source_group dan split. Isi label preferensi tanpa mengubah respons sumber. Ekspor UTF-8 CSV, jalankan validasi lalu kirim file sesuai penamaan COHORT_ID_PESERTA_BATCH_VERSI. Assessor memeriksa task_id unik, field wajib, label sah dan jumlah task sesuai manifest."},{type:"heading",text:"Struktur kanal"},{type:"paragraph",text:"Announcements hanya untuk jadwal dan versi. Helpdesk memakai template: task_id, guideline_version, masalah, dugaan keputusan, dan bukti yang sudah diperiksa. Calibration hanya memuat keputusan yang disetujui QA. Lounge boleh dipisah dan tidak menjadi sumber instruksi proyek. Pin indeks FAQ agar pertanyaan penting tidak tenggelam."}]},{title:"25 Proyek P1 Evaluasi asisten layanan pelanggan",blocks:[{type:"paragraph",text:"Tema: mengevaluasi respons asisten toko daring fiktif. Peserta berperan sebagai evaluator, reviewer dan project coordinator. Semua data dalam toolkit sintetis; tidak ada pelanggan sungguhan. Latihan menguji kepatuhan kebijakan, fakta, privasi, klarifikasi dan format."},{type:"table",rows:[["Scope","Spesifikasi"],["Dataset inti","48 pasangan dari 16 source group; masing-masing 3 variasi"],["Split grup","24 practice, 12 calibration, 12 holdout; satu group hanya berada di satu split"],["Tambahan capstone","60 pasangan dari 20 skenario terpisah tersedia di folder mentor; QA mengesahkan sebelum tes"],["Output per task","winner, evidence, rule_id, confidence, error_code, guideline_version"],["Durasi","8 jam mini simulasi; capstone 40 jam terpisah"],["Di luar scope","Kontak pelanggan, transaksi, akses akun, training model dan penggunaan data nyata"]]},{type:"heading",text:"Definition of done mini simulasi"},{type:"paragraph",text:"Seluruh task yang ditugaskan terlacak; submission valid; \u226585% preferensi pada item gold terselesaikan; alasan \u22653/4; nol critical; semua abstain memiliki sebab; handover mencantumkan numerator dan denominator. Karena holdout hanya 12 item, ini bukti latihan awal dan tidak menggantikan G3 dua batch baru."},{type:"heading",text:"Paket yang dibagikan"},{type:"paragraph",text:"Trainee menerima README, practice.csv, submission_template.csv dan guideline. Mentor menyimpan calibration.csv, holdout.csv dan gold_all.csv terpisah; hanya task tanpa gold yang dibagikan saat ujian. Jangan membagikan dokumen induk penuh ketika quiz atau holdout masih aktif."},{type:"heading",text:"Expected outcome"},{type:"paragraph",text:"Dataset preferensi yang dapat direview, scorecard individual, daftar ketidaksepakatan, satu change request guideline dan satu handover. Tidak semua pasangan layak menjadi chosen/rejected: tie dan abstain dikeluarkan atau ditangani sesuai keputusan tim engineering."}]},{title:"26 Guideline P1 versi 1 dan worked example",blocks:[{type:"table",rows:[["ID aturan","Aturan operasional"],["P1","Gunakan policy_text pada task sebagai satu-satunya sumber fakta kebijakan"],["P2","Utamakan kesesuaian fakta dan prasyarat sebelum kelancaran bahasa"],["P3","Jika informasi wajib belum ada, respons meminta klarifikasi dan tidak menjanjikan hasil"],["P4","Jangan meminta atau mengungkap kata sandi, OTP, kartu penuh atau data pelanggan lain"],["P5","Ikuti bahasa, jumlah poin dan format yang diminta secara eksplisit"],["P6","Pilih A atau B bila satu jelas lebih memenuhi aturan; tie bila mutu setara"],["P7","Pilih abstain jika sumber wajib hilang atau kedua respons tidak dapat diputuskan secara sah"],["P8","Evidence harus menyebut perbedaan konkret; dilarang mengarang kebijakan atau sumber"]]},{type:"heading",text:"Prioritas dan batas"},{type:"paragraph",text:"Privasi P4 mengalahkan keuntungan gaya. Setelah privasi, prioritaskan fakta dan prasyarat P1\u2013P3, lalu format P5 dan clarity. Jika keduanya salah tetapi satu menghindari kesalahan material sementara lainnya menambahnya, pilih yang lebih baik bila perbedaannya jelas. Gunakan abstain saat perbandingan tidak dapat dinilai dari sumber, bukan sekadar karena keduanya tidak sempurna."},{type:"heading",text:"Contoh lengkap"},{type:"paragraph",text:"Policy: refund dalam 7 hari dengan bukti pembelian, dana kembali 3\u20135 hari kerja setelah disetujui. User: \u201CSaya beli 4 hari lalu, bukti ada. Berapa lama refund?\u201D A: \u201CPasti masuk hari ini.\u201D B: \u201CSetelah disetujui, dana kembali dalam 3\u20135 hari kerja.\u201D"},{type:"paragraph",text:"Keputusan: B. Rule_id: P1. Evidence: A menjanjikan hari ini, bertentangan dengan 3\u20135 hari kerja pada policy; B sesuai. Confidence: high. Error_code: unsupported_promise. Jika policy_text kosong dan pertanyaan meminta batas waktu, pilih abstain, missing_source, P7."}]},{title:"27 Sprint P1 dan rubrik proyek",blocks:[{type:"table",rows:[["Tahap","Waktu","Aktivitas dan owner"],["Kickoff","30 menit","Owner menyampaikan scope dan instruksi; tanpa kunci"],["Calibration awal","60 menit","Trainee menilai 6 practice, QA membahas setelah submit"],["Produksi practice","90 menit","18 practice lain independen, mentor memberi feedback"],["Tes calibration","60 menit","12 task tertutup; assessor menilai"],["Review dan revisi","60 menit","Trainee mengoreksi error; versi awal disimpan"],["Tes holdout","60 menit","12 task baru tanpa coaching"],["Handover","60 menit","Validasi, audit dan laporan"],["Retrospective","60 menit","Analisis bias dan rencana transfer"]]},{type:"table",rows:[["Dimensi","Bobot","Anchor nilai 3 dari 4"],["Kualitas preferensi","45%","85\u201394% sesuai gold; 4 untuk \u226595%; 2 untuk 70\u201384%; 1 untuk 50\u201369%; 0 untuk <50%"],["Penerapan guideline","20%","Aturan relevan pada \u226590% task; salah aturan material maksimal 1"],["Alasan berbukti","15%","\u226590% alasan memuat perbedaan, sumber dan dampak tanpa fakta tambahan"],["QA mandiri","10%","Schema valid dan semua blocker tercatat sebelum review"],["Handover","10%","Jumlah, versi, unresolved, hasil metrik dan owner lengkap"]]},{type:"paragraph",text:"Untuk dimensi selain kualitas, anchor umum 0\u20134 pada bagian kompetensi dipakai; nilai 4 mensyaratkan seluruh kriteria 3 terpenuhi dan mampu menemukan masalah sistemik dengan usulan teruji. Jangan memberi 4 hanya karena alasan lebih panjang. Rubrik harus diterapkan pada submission pertama; revisi dilaporkan sebagai hasil belajar terpisah."},{type:"paragraph",text:"Abstain gold termasuk label sah dalam accuracy. Kasus yang gold-nya unresolved dikeluarkan dari denominator dan ditampilkan terpisah. Pada proyek produksi, abstain perlu penanganan terpisah dan tidak dianggap output model preference final."}]},{title:"28 Proyek P2 QA audio percakapan",blocks:[{type:"paragraph",text:"Tema: layanan toko fiktif melalui telepon. Scope: 6 klip, masing-masing 20\u201345 detik, dua speaker, minimal 2 klip memiliki overlap dan 1 klip memiliki bagian tidak jelas. Total sekitar 3 menit audio. Skrip tersedia dalam toolkit; audio belum disertakan dan harus direkam dengan izin peserta atau dibuat dari sumber yang disetujui sebelum sesi."},{type:"heading",text:"Persiapan mentor sebelum menugaskan"},{type:"paragraph",text:"Rekam skrip memakai dua orang yang setuju untuk kebutuhan latihan. Samarkan nama dan jangan menyebut data pribadi. Simpan wav atau format yang disepakati; hindari pemrosesan noise berlebihan yang mengubah ujaran. Dua reviewer mendengarkan audio aktual, memperbaiki referensi kata, menetapkan timestamp dan mengadjudikasi perbedaan. Skrip tertulis bukan gold jika rekaman berbeda."},{type:"heading",text:"Deliverable trainee"},{type:"paragraph",text:"segments.csv berisi audio_id, segment_id, start_sec, end_sec, speaker_id, transcript, event dan confidence. Sertakan normalization.md dan issue_log.csv. Overlap lintas speaker boleh; start harus lebih kecil dari end; semua waktu berada dalam durasi audio. Transkrip referensi dan audio disimpan terpisah dari submission."},{type:"table",rows:[["Komponen","Bobot","Target dummy"],["Kata","40%","WER \u226410% setelah normalisasi tetap"],["Batas segmen","25%","\u226590% start/end sesuai \xB10.20 detik"],["Speaker","15%","\u226595% segmen ber-ID speaker benar"],["Event dan overlap","10%","\u226590% event wajib ditemukan"],["Schema dan audit","10%","Seluruh timestamp valid dan issue tercatat"]]},{type:"paragraph",text:"Skor kata = max(0, 100\xD7(1\u2212WER)); komponen lain adalah persentase sesuai target di tabel. Total = 0,40\xD7kata + 0,25\xD7batas + 0,15\xD7speaker + 0,10\xD7event + 0,10\xD7schema. Overall \u226585 dan semua target tabel wajib terpenuhi. WER = (substitusi + delesi + insersi) \xF7 jumlah kata referensi. Contoh S=4, D=3, I=2, N=100 memberi 9%. Laporkan N; WER dapat melebihi 100%. Untuk N=0 laporkan kasus hening terpisah. [R6]"},{type:"paragraph",text:"Jadwal 8 jam: 2 persiapan dan demo, 2 annotation, 1 review, 1 revisi, 1 uji baru dan 1 refleksi. Kelulusan audio tidak otomatis berarti lulus penilaian LLM."}]},{title:"29 Proyek P3 QA dan perbaikan guideline",blocks:[{type:"paragraph",text:"Tema: memulihkan kualitas batch layanan pelanggan setelah perubahan kebijakan. Toolkit menyediakan 40 submission sintetis untuk review: 28 clean, 6 major, 4 minor dan 2 critical. File p3_audit_tasks dan kunci terpisah tersedia. Dua assessor wajib mengesahkan lokasi cacat dan severity sebelum latihan. Jangan memakai hasil peserta yang belum diadjudikasi sebagai kunci."},{type:"heading",text:"Scope dan perubahan yang disisipkan"},{type:"paragraph",text:"Gunakan kebijakan baru v2: batas refund berubah dari 7 menjadi 10 hari, tetapi syarat bukti tetap. Enam major berupa preferensi salah yang mengubah keputusan. Empat minor berupa typo kosmetik pada catatan yang tidak mengubah makna. Dua critical berupa permintaan OTP dan bukti palsu. Lima kasus borderline tersedia untuk diskusi terpisah dan tidak dihitung dalam 40 gold."},{type:"heading",text:"Tugas dan output"},{type:"paragraph",text:"Audit independen 40 task, klasifikasikan severity, buat confusion matrix temuan, lakukan adjudication untuk 5 borderline, tulis root cause dan rancangan guideline v2.1. Ajarkan perubahan 10 menit kepada 4 anggota lalu uji dengan 5 item baru per orang. Serahkan audit.csv, decision_log.csv, change_log.md, microteaching_plan.md dan handover."},{type:"table",rows:[["Evaluasi","Bobot","Syarat"],["Deteksi major dan critical","35%","Recall gabungan \u226590%; semua 2 critical ditemukan"],["Ketepatan flag","20%","False positive pada 28 clean \u226410%"],["Adjudication berbukti","20%","\u22654/5 keputusan defensible dengan aturan"],["Perbaikan guideline","15%","Definisi, contoh kontra, owner dan dampak jelas"],["Microteaching","10%","\u226580% jawaban baru benar pada kelompok"]]},{type:"paragraph",text:"Skor komponen: recall% untuk deteksi; 100\xD7(1\u2212false positive rate) untuk ketepatan; keputusan diterima/5\xD7100 untuk adjudication; checklist guideline 5 butir masing-masing 20; dan persentase jawaban benar untuk microteaching. Gunakan bobot tabel. Jadwal 12 jam: briefing 1, audit 3, adjudication 2, redesign 2, microteaching 1, tes transfer 1 dan handover 2. Nilai total \u226585 serta seluruh gate wajib dipenuhi. Jika satu critical terlewat, peserta belum siap menjadi reviewer walaupun skor total tinggi."}]},{title:"30 Capstone dan portfolio siap proyek",blocks:[{type:"paragraph",text:"Capstone berbeda dari mini simulasi. Toolkit menyediakan 60 pasangan dari 20 skenario yang terpisah dari mini simulasi, terdiri atas 30 task Batch A dan 30 task Batch B. Semua task serta kunci berada di folder mentor. QA harus memeriksa dan mengesahkan gold sebelum penilaian. Blueprint menjelaskan komposisi dan cara mengganti task setelah terpapar; peserta tidak boleh melihat batch ini sebelum gate."},{type:"table",rows:[["Minggu","Pekerjaan peserta","Bukti"],["17\u201318","Batch A 30 task, self QA dan handover","Submission awal, scorecard dan error log"],["19\u201320","Perubahan guideline v2 dan Batch B 30 task","Tes transfer dengan sumber baru"],["21\u201322","Review 20 task orang lain atau P3","Audit dan feedback yang bisa diterapkan"],["23","Perbaiki portfolio dan presentasi 15 menit","Satu kasus benar, satu salah dan satu eskalasi"],["24","Panel gate dan rencana 30 hari","Keputusan scope readiness dan IDP"]]},{type:"heading",text:"Isi portfolio yang aman dibagikan"},{type:"paragraph",text:"Profil kompetensi, deskripsi tugas sintetis, 3 contoh keputusan dengan evidence, metrik dengan denominator, contoh revisi dan refleksi singkat. Jangan mengklaim dummy project sebagai pengalaman klien. Bagikan hanya data sintetis dan materi yang diizinkan owner; guideline klien dan data produksi tidak masuk portfolio publik."},{type:"heading",text:"Checklist serah terima"},{type:"paragraph",text:"Manifest cocok dengan jumlah task dan tidak ada ID duplikat."},{type:"paragraph",text:"Guideline_version sama dengan yang diuji; perubahan tercatat."},{type:"paragraph",text:"Semua field wajib terisi; unresolved dan abstain diberi alasan."},{type:"paragraph",text:"QA report memisahkan sampel acak dan sampel terarah."},{type:"paragraph",text:"Kunci, gold, split dan data sensitif tidak masuk file penerima."},{type:"paragraph",text:"Owner menerima batch atau meminta revisi dengan alasan dan tenggat."},{type:"paragraph",text:"Keputusan panel: ready for scope tertentu, ready with supervision, pending evidence atau needs development. Catat jenis tugas, bahasa, versi guideline, tanggal, reviewer dan tanggal kalibrasi ulang. Readiness diperiksa kembali setelah perubahan scope atau jeda proyek panjang."}]},{title:"31 Standar kompetensi dan bobot",blocks:[{type:"paragraph",text:"Nilai setiap kompetensi pada skala 0\u20134 berdasarkan bukti terbaru, bukan kesan mentor. Profil ini menentukan kebutuhan pembinaan; scorecard gate tetap memakai bobot output pada bagian 05. Jangan mencampur dua bobot menjadi satu tanpa alasan."},{type:"table",rows:[["Kode dan kompetensi","Bobot profil","Bukti minimum","Target level"],["C01 Literasi AI","5%","Penjelasan data, model dan inference","3 dasar"],["C02 Guideline","15%","20 task dengan rule_id tepat","3 semua"],["C03 Tool dan data","8%","Impor, validasi dan ekspor","3 semua"],["C04 Annotation","12%","40 label baru per scope","3 spesialisasi"],["C05 Rubrik LLM","12%","12 pasangan baru dan skor dimensi","3 spesialisasi"],["C06 Evidence","12%","10 alasan yang dapat direproduksi","3 semua"],["C07 Verifikasi","8%","5 claim ledger","3 scope factual"],["C08 Privasi dan integritas","10%","6 skenario kritis","3 wajib"],["C09 QA dan kalibrasi","10%","20 audit dan log konflik","3 trainer; 4 lead"],["C10 Komunikasi","4%","Handover dan eskalasi","3 semua"],["C11 Validasi atau coding","2%","Validator dan hasil pengecekan","2 dasar; 3 advanced"],["C12 Coaching","2%","Microteaching dengan post check","2 trainer; 3 mentor"]]},{type:"paragraph",text:"Profil 100 poin = \u03A3(bobot \xD7 level/4). Profil bukan izin produksi: semua kompetensi wajib untuk scope harus mencapai level 3 dan gate terkait lulus. C04 atau C05 yang tidak relevan dengan scope dinyatakan N/A; untuk profil scope, normalisasi ulang bobot yang relevan dan laporkan mana yang dikecualikan."},{type:"heading",text:"Validitas bukti"},{type:"paragraph",text:"Gunakan minimal dua jenis bukti untuk keputusan kesiapan: hasil kerja dan observasi atau tes kasus baru. Setiap nilai memuat task_id, tanggal, versi, assessor dan alasan. Bukti lama lebih dari 90 hari memerlukan kalibrasi ulang untuk scope yang berubah; angka ini kebijakan usulan internal."}]},{title:"32 Anchor rubrik kompetensi",blocks:[{type:"table",rows:[["Level","Perilaku yang dapat diamati","Keputusan pembinaan"],["0 Belum terbukti","Tidak ada bukti valid atau tidak dapat menyelesaikan langkah; bedakan missing evidence dari salah","Kumpulkan baseline, jangan beri akses mandiri"],["1 Dengan arahan penuh","Membutuhkan petunjuk pada hampir setiap keputusan; error utama berulang","Demo, latihan kecil dan review 100%"],["2 Dengan bantuan","Benar pada kasus rutin tetapi masih salah pada pengecualian; revisi material dibutuhkan","Klinik edge case dan tes transfer"],["3 Mandiri pada scope","Output memenuhi target pada kasus baru, evidence jelas, eskalasi tepat","Boleh tugas scope yang diuji setelah gate"],["4 Meningkatkan sistem","Memenuhi level 3 dan menemukan pola error, memperbaiki aturan serta membuktikan dampak","Calon reviewer, mentor atau calibration lead"]]},{type:"heading",text:"Anchor spesifik untuk evidence"},{type:"paragraph",text:"0: alasan kosong atau palsu. 1: hanya opini. 2: ada kutipan tetapi aturan atau dampak tidak tepat. 3: keputusan, aturan, evidence dan dampak saling cocok pada \u226590% task yang ditinjau. 4: seluruh kriteria 3 dan mampu mendeteksi pola kelemahan evidence serta memperbaiki contoh acuan yang lolos uji baru."},{type:"heading",text:"Anchor spesifik untuk guideline"},{type:"paragraph",text:"0: guideline diabaikan. 1: hanya meniru contoh persis. 2: aturan umum benar tetapi pengecualian material salah. 3: aturan dan pengecualian diterapkan pada \u226590% task, ambiguitas diangkat. 4: menyusun klarifikasi yang disetujui QA dan mengurangi konflik pada kasus unseen."},{type:"heading",text:"Checklist assessor"},{type:"paragraph",text:"Apakah bukti independen? Apakah jenis tugas sebanding? Apakah kesalahan berasal dari peserta, sumber atau guideline? Apakah sampel memiliki kelas langka? Apakah penilai telah dikalibrasi? Jika ada N/A atau pending evidence, jangan menulis skor nol sebagai kemampuan aktual. Sertakan catatan scope pada keputusan akhir."}]},{title:"33 Desain assessment dan anti bias",blocks:[{type:"table",rows:[["Metode","Frekuensi","Apa yang diukur","Kontrol"],["Pre dan post quiz","Awal dan akhir modul","Pemahaman konsep","Bentuk setara A/B, bukan soal identik"],["Performance task","Setiap modul","Penerapan pada kasus baru","Blind review dan guideline tetap"],["Peer feedback","Mingguan","Kemampuan memberi bukti","Tidak menjadi nilai akhir tunggal"],["Project review","G2 dan G3","Kualitas batch dan workflow","Dua assessor pada borderline"],["Tes transfer","Setelah revisi aturan","Adaptasi, bukan hafalan","Source group baru"],["Audit proyek","Hari 7 dan 30","Transfer ke pekerjaan","Case mix dan sampling tercatat"]]},{type:"heading",text:"Prosedur penilaian yang konsisten"},{type:"paragraph",text:"Sebelum ujian, dua assessor menilai 10 anchor secara independen. Diskusikan perbedaan hingga aturan dapat diterapkan, bukan sekadar menyamakan angka. Bekukan versi rubrik dan kunci; unresolved tidak menjadi gold. Sembunyikan nama peserta bila memungkinkan. Review ulang semua skor dalam 5 poin dari ambang kelulusan dan minimal 20% sampel lain."},{type:"heading",text:"Banding dan retest"},{type:"paragraph",text:"Peserta dapat mengajukan banding dalam 3 hari kerja dengan task_id, aturan dan evidence. Assessor lain menjawab maksimal 5 hari kerja. Jika kunci salah, perbarui version log dan nilai ulang seluruh peserta terdampak. Retest memakai kelompok sumber baru dengan kesulitan setara; simpan skor awal dan akhir."},{type:"heading",text:"Aturan penggunaan AI saat assessment"},{type:"paragraph",text:"Latihan terbuka boleh menggunakan alat yang disetujui dengan disclosure. Baseline dan gate tertutup dikerjakan tanpa bantuan generatif kecuali skill menggunakan tool memang sedang diukur. Nyatakan aturan sebelum ujian. Jangan menganggap teks rapi sebagai bukti pelanggaran; periksa riwayat kerja dan lakukan klarifikasi berbasis fakta."}]},{title:"36 Metric kualitas dan contoh perhitungan",blocks:[{type:"table",rows:[["Metrik","Formula","Penggunaan dan batas"],["Accuracy","Benar \xF7 seluruh gold terselesaikan \xD7100%","Nominal atau preferensi; tampilkan per kelas"],["Precision error","Flag benar \xF7 seluruh flag","Mengukur ketepatan temuan reviewer"],["Recall error","Error ditemukan \xF7 seluruh error gold","Mengukur error yang terlewat"],["F1","2TP \xF7 (2TP+FP+FN)","Untuk label atau temuan; macro per kelas [R8]"],["Agreement","Label identik \xF7 item overlap","Konsistensi; bukan kebenaran"],["Kappa","(po\u2212pe) \xF7 (1\u2212pe)","Dua penilai nominal; N/A jika pe=1 [R5]"],["First pass yield","Task diterima tanpa revisi \xF7 task reviewed","Gunakan submission pertama saja"],["Rework rate","Task perlu revisi \xF7 task reviewed","Pisahkan minor dan major"],["AHT aktif","Menit aktif \xF7 task selesai","Bandingkan scope dan kesulitan sama"]]},{type:"heading",text:"Contoh audit reviewer"},{type:"paragraph",text:"Gold memiliki 10 error; reviewer menemukan 8 dengan 2 false alarm. TP=8, FN=2, FP=2. Precision=80%, recall=80%, F1=80%. Jika 30 item clean, false positive rate=2/30=6,7%. Jangan menyebut precision dan false positive rate sebagai metrik yang sama."},{type:"heading",text:"Contoh outcome batch"},{type:"paragraph",text:"Dari 40 task reviewed, 34 diterima pertama kali dan 6 direvisi: FPY=85%, rework=15%. Dua task missing source yang belum reviewed tidak masuk denominator; laporkan 2 pending secara terpisah. Kecepatan hanya dievaluasi setelah kualitas memenuhi gate; peserta tidak diberi insentif menebak untuk mengejar AHT."},{type:"paragraph",text:"Untuk nol denominator tampilkan N/A. Jangan merata-ratakan persentase batch berlainan ukuran tanpa bobot jumlah. Simpan numerator dan denominator; gunakan jumlah agregat saat melaporkan cohort. Untuk label timpang, sertakan distribusi, confusion matrix dan macro F1."}]},{title:"37 Diagnosis kebutuhan peningkatan skill",blocks:[{type:"paragraph",text:"Belum ada data assessment atau kualitas proyek perusahaan yang diberikan. Karena itu jumlah skill yang benar-benar perlu ditingkatkan belum dapat disimpulkan. Program menilai 12 domain C01\u2013C12; enam domain menjadi hipotesis prioritas awal, bukan temuan perusahaan."},{type:"table",rows:[["Hipotesis prioritas","Sinyal yang harus diuji","Intervensi awal"],["C02 Guideline","Error aturan atau pengecualian berulang","Decision tree dan edge case clinic"],["C05 Evaluasi LLM","Skor dipengaruhi gaya atau panjang","Anchor dan blind comparison"],["C06 Evidence","Alasan generik atau tidak dapat diverifikasi","Klinik rewrite dan claim ledger"],["C08 Privasi","Salah jalur data atau respons unsafe","Skenario praktis dan tool policy"],["C09 QA kalibrasi","Konflik antar penilai dan error lolos","Double annotation dan adjudication"],["C03 Tool data","ID rusak, ekspor salah atau field kosong","Latihan schema dan validasi"]]},{type:"heading",text:"Sprint diagnosis 10 hari kerja"},{type:"paragraph",text:"Hari 1\u20132: petakan scope proyek dan target level. Hari 3\u20135: baseline 24 anggota dan audit 10 task terbaru per anggota jika tersedia serta diizinkan. Hari 6\u20137: dua assessor menyelaraskan rubrik. Hari 8: hitung gap. Hari 9: validasi dengan mentor dan owner. Hari 10: terbitkan prioritas, biaya dan IDP. Jika belum ada produksi, gunakan simulasi dan tandai keterbatasan transfer."},{type:"heading",text:"Rumus jumlah skill yang perlu boost"},{type:"paragraph",text:"Gap anggota pada skill = max(0, target level \u2212 level terbukti). Suatu skill masuk prioritas cohort bila \u226530% anggota relevan berada di bawah target atau ada critical terkonfirmasi yang terkait skill itu. Jumlah skill boost adalah hitungan domain unik yang memenuhi aturan, bukan jumlah orang. Laporkan denominator anggota relevan untuk setiap domain."},{type:"paragraph",text:"Contoh sintetis: C06 memiliki 10 dari 24 anggota di bawah target = 41,7%, sehingga diprioritaskan. Ini contoh cara menghitung, bukan hasil perusahaan. Jika bukti belum ada, status pending evidence dan jadwalkan tes; jangan menganggapnya otomatis gap kemampuan."}]},{title:"38 Prioritas skill dan roadmap pembinaan",blocks:[{type:"paragraph",text:"Gunakan skor prioritas P = 0,40\xD7G + 0,35\xD7R + 0,25\xD7D. G adalah persentase anggota relevan di bawah target. R adalah risiko error pada skala 0\u2013100 yang disepakati QA. D adalah kebutuhan proyek 90 hari pada skala 0\u2013100 dari owner. Bobot merupakan pilihan internal; critical terkonfirmasi tetap ditangani segera tanpa menunggu ranking."},{type:"table",rows:[["Fase","Aksi","Ukuran berhasil dan owner"],["Hari 1\u201330","Baseline, fondasi, guideline dan evidence","100% anggota punya IDP; L&D dan mentor"],["Hari 31\u201360","Klinik prioritas dan G1","\u226580% peserta aktif lulus G1; lead trainer"],["Hari 61\u201390","Spesialisasi dan kalibrasi","Gap prioritas berkurang \u226525%; QA"],["Hari 91\u2013120","G2, capstone dan revisi","Dua batch sesuai target; trainer dan QA"],["Hari 121\u2013150","Supervised practice dan microteaching","FPY stabil, reviewer readiness terukur; Ops"],["Hari 151\u2013180","G3 dan placement review","Scope readiness dan rencana 30 hari; owner"]]},{type:"heading",text:"Contoh IDP individual"},{type:"paragraph",text:"Anggota T07: C06 level 2, target 3; error berupa evidence tidak relevan pada 4/10 task. Dua minggu: pelajari M08, revisi 5 alasan dan nilai 10 task unseen. Mentor Rina memberi feedback hari Rabu. Berhasil bila \u22659/10 alasan memenuhi checklist dan tidak ada bukti palsu. Bukti disimpan sebagai task ID; jadwal cek Jumat minggu kedua. Nama mentor di sini contoh, bukan staf nyata."},{type:"heading",text:"Sustain kemampuan"},{type:"paragraph",text:"Setelah penempatan: kalibrasi 30 menit/minggu, audit hari 7 dan 30, refresh bulanan pada edge case, dan asesmen scope setiap 90 hari atau setelah perubahan material. Rotasi spesialisasi hanya setelah kualitas stabil. Buat bank contoh berversi, catat owner dan tanggal review; arsipkan contoh yang tidak lagi berlaku."}]},{title:"39 KPI triwulan dan tata kelola data",blocks:[{type:"table",rows:[["KPI dan target pilot","Formula","Sumber dan pemilik"],["Completion \u226585%","Lulus seluruh kegiatan \xF7 enrolled setelah cut off \xD7100%","LMS; L&D"],["Readiness \u226580%","Lulus G3 \xF7 enrolled setelah cut off \xD7100%","Gate register; QA"],["Transfer FPY \u226590%","Accepted first pass \xF7 reviewed pada hari 7\u201330 \xD7100%","Audit proyek; Ops QA"],["Retensi skill \u226590%","Lulus cek ulang \xF7 peserta eligible yang diuji \xD7100%","Tes 30 hari; L&D"],["Feedback SLA \u226590%","Feedback \u22642 hari kerja \xF7 feedback jatuh tempo \xD7100%","Ticket log; mentor lead"],["Gap closure \u226525%","(Gap awal\u2212gap akhir) \xF7 gap awal \xD7100%","Profil matched; analyst"],["Satisfaction \u22654 dari 5","\u03A3 skor valid \xF7 jumlah jawaban valid","Survey; L&D"],["Cost per ready","Biaya cohort \xF7 peserta G3 ready","Finance dan gate register"]]},{type:"paragraph",text:"Semua target adalah titik awal pilot. Enrolled setelah cut off adalah peserta yang tercatat aktif pada akhir minggu 2; pengunduran diri sesudahnya tetap berada dalam denominator. Untuk readiness, peserta yang belum mencapai G3 dihitung belum ready. Laporkan completion dan readiness cohort terpisah dari pass rate hanya peserta yang mengikuti tes."},{type:"heading",text:"Laporan triwulan yang jujur"},{type:"paragraph",text:"Cohort belum jatuh tempo G3 ditampilkan sebagai in progress dan tidak digabung dengan cohort selesai. Retensi harus menyertakan coverage = diuji \xF7 eligible. Jika 18/20 lulus tetapi eligible 24, retention 90% dengan coverage 83,3%; empat yang belum diuji tidak boleh hilang dari laporan."},{type:"paragraph",text:"Gap closure memakai orang dan skill yang sama pada baseline dan post. Tambahkan tabel missing data. Simpan data mentah per individu terbatas pada L&D, assessor dan owner sesuai kebutuhan; dashboard umum menggunakan agregat. L&D menetapkan retensi dan penghapusan sesuai kebijakan perusahaan sebelum cohort dimulai."}]},{title:"40 Evaluasi efektivitas dan atribusi",blocks:[{type:"table",rows:[["Lapisan evaluasi","Pertanyaan","Bukti dan waktu"],["Pengalaman belajar","Apakah materi jelas dan dukungan tersedia?","Survey mingguan dan akhir track"],["Peningkatan kemampuan","Apakah peserta lebih mampu pada kasus baru?","Pre/post setara dan performance task"],["Transfer kerja","Apakah kualitas bertahan dalam pekerjaan?","Audit hari 7, 30 dan 90"],["Dampak operasi","Apakah rework dan waktu readiness membaik?","Batch setara sebelum dan sesudah per triwulan"]]},{type:"heading",text:"Contoh laporan triwulan sintetis"},{type:"paragraph",text:"24 enrolled, 21 selesai dan 18 lulus G3: completion 87,5%, readiness 75%. Readiness di bawah target 80% walau completion lulus. Biaya contoh Rp48.000.000 menghasilkan cost per ready Rp2.666.667. Nilai ini ilustrasi perhitungan; bukan estimasi biaya pasar atau hasil aktual perusahaan."},{type:"paragraph",text:"Dari 600 task baru yang reviewed, 552 diterima first pass: FPY=92%. Kualitas harus dibandingkan pada jenis tugas, versi, bahasa dan kesulitan yang sebanding. Satu cohort saja tidak membuktikan training menyebabkan seluruh peningkatan."},{type:"heading",text:"Desain pembanding yang layak"},{type:"paragraph",text:"Jika memungkinkan gunakan rollout bertahap: kelompok yang belum mendapat modul menjadi pembanding sementara, lalu tetap mendapat training. Catat baseline dan post keduanya. Difference in differences = perubahan kelompok training \u2212 perubahan pembanding. Contoh FPY 80\u219292 dibanding 82\u219286 memberi selisih 8 poin persentase. Jelaskan kemungkinan perbedaan case mix, mentor dan seleksi peserta."},{type:"heading",text:"Manfaat dan biaya"},{type:"paragraph",text:"Estimasi penghematan = pengurangan jam rework \xD7 biaya tenaga per jam. ROI training = (manfaat terukur\u2212biaya training) \xF7 biaya training \xD7100%. Laporkan hanya manfaat yang dapat ditelusuri; hindari menghitung penghematan yang sama pada dua KPI. Untuk pilot, utamakan kualitas dan readiness sebelum klaim ROI finansial."}]},{title:"41 Survey dan peer feedback siap pakai",blocks:[{type:"heading",text:"Survey akhir minggu sekitar 3 menit"},{type:"paragraph",text:"Skala: 1 sangat tidak setuju, 2 tidak setuju, 3 netral, 4 setuju, 5 sangat setuju; sediakan N/A. Tidak wajib mengisi nama untuk feedback pengalaman. Jangan meminta data pribadi yang tidak diperlukan."},{type:"paragraph",text:"Saya memahami tujuan dan syarat lulus minggu ini."},{type:"paragraph",text:"Contoh membantu saya menangani task yang belum pernah dilihat."},{type:"paragraph",text:"Guideline dan rubrik tersedia serta mudah ditemukan."},{type:"paragraph",text:"Feedback menjelaskan apa yang salah dan cara memperbaikinya."},{type:"paragraph",text:"Saya bisa bertanya atau mengakui kebingungan tanpa dipermalukan."},{type:"paragraph",text:"Beban belajar sesuai waktu yang telah disepakati."},{type:"paragraph",text:"Tool dan akses memungkinkan saya mengerjakan latihan."},{type:"paragraph",text:"Saya tahu kapan bantuan mentor tersedia."},{type:"paragraph",text:"Pertanyaan terbuka: kasus apa yang paling membingungkan? Satu hal apa yang harus dipertahankan? Satu perubahan apa yang paling membantu minggu depan? Adakah hambatan akses atau jadwal yang ingin dilaporkan secara privat?"},{type:"heading",text:"Survey owner setelah 30 hari proyek"},{type:"paragraph",text:"Nilai 1\u20135 dan beri contoh task: akurasi, kemandirian pada scope, evidence, kualitas eskalasi dan kesiapan handover. Tanyakan apakah scope atau guideline berubah sejak training. Jawaban \u201Cbelum mengamati\u201D dipisahkan dari nilai 1."},{type:"heading",text:"Format peer feedback"},{type:"paragraph",text:"Task ID dan versi \u2192 keputusan yang saya lihat \u2192 aturan yang relevan \u2192 evidence \u2192 saran revisi \u2192 pertanyaan yang belum terjawab. Contoh: \u201CPada T12, A dipilih padahal menjanjikan hari ini; P1 menyebut 3\u20135 hari. Cek ulang preferensi atau jelaskan bukti lain.\u201D Penulis menerima, menolak dengan evidence atau mengeskalasi. Mentor memeriksa 20% feedback untuk mencegah koreksi keliru menyebar."},{type:"paragraph",text:"Analisis survey per item dengan rata-rata, distribusi dan response rate. Jangan menerbitkan komentar yang mengidentifikasi peserta. Item <3,5 atau turun \u22650,5 menjadi pemicu investigasi, bukan otomatis bukti trainer gagal."}]},{title:"42 Siklus perbaikan dan intervensi",blocks:[{type:"table",rows:[["Pemicu","Diagnosis dalam 5 hari kerja","Tindakan dan tes keberhasilan"],["Readiness <80%","Lihat gap per skill, attrition dan missing evidence","Klinik 2 minggu; ukur task baru"],["FPY turun >5 poin","Cek case mix, versi dan error code","Tahan scope terdampak; kalibrasi ulang"],["Agreement <85%","Cek label langka dan guideline ambigu","Tambahkan anchor; ulang blind set baru"],["SLA feedback <90%","Cek antrean dan kapasitas reviewer","Kecilkan batch atau tambah reviewer"],["Survey clarity <3,5","Baca komentar dan uji instruksi pada 3 peserta","Ubah contoh; cek pemahaman sesudahnya"],["Critical terkonfirmasi","Batasi distribusi dan cek dampak","Remediasi, audit meluas dan otorisasi ulang"]]},{type:"heading",text:"Ritme review manajemen"},{type:"paragraph",text:"Setiap minggu mentor meninjau blocker dan top error. Setiap bulan QA dan trainer memeriksa drift serta bank gold. Setiap triwulan L&D memutuskan modul yang dipertahankan, diubah atau dihentikan berdasarkan data. Project owner menyepakati skill yang paling dibutuhkan untuk 90 hari berikutnya."},{type:"heading",text:"Template eksperimen perbaikan"},{type:"paragraph",text:"Masalah: 40% alasan tidak menyebut evidence. Hipotesis: contoh kontra belum cukup. Intervensi: satu klinik rewrite 45 menit. Pembanding: kelas terjadwal berikut yang belum menerima klinik. Ukuran: proporsi alasan memenuhi checklist pada 10 task baru, dinilai blind. Owner: lead trainer. Review: 2 minggu. Berhasil jika peningkatan \u226515 poin persentase tanpa kenaikan critical; angka adalah kriteria pilot yang disepakati sebelumnya."},{type:"heading",text:"Tips khusus L&D manager"},{type:"paragraph",text:"Jangan menambah modul sebelum mengetahui jenis error. Sisihkan kapasitas review saat merencanakan cohort. Pisahkan completion, competence dan readiness. Audit kunci sebelum menyalahkan peserta. Pelihara bank contoh serta daftar keputusan, bukan hanya rekaman kelas. Minta owner menilai transfer; kepuasan belajar saja belum cukup untuk menyatakan program efektif."}]},{title:"43 Template operasional yang dapat disalin",blocks:[{type:"heading",text:"A Form review proyek"},{type:"paragraph",text:"Peserta: ____  Track: ____  Project: ____  Batch: ____  Guideline: ____  Assessor: ____  Tanggal: ____"},{type:"paragraph",text:"Task reviewed: ____  Gold resolved: ____  Benar: ____  Critical: ____  Major: ____  Minor: ____  Pending: ____"},{type:"paragraph",text:"Skor kualitas __/4; guideline __/4; evidence __/4; self QA __/4; handover __/4. Total berbobot __/100. Gate wajib: lulus / belum. Keputusan scope: ____. Bukti utama task_id: ____. Alasan dan tanggal review ulang: ____."},{type:"heading",text:"B Individual development plan"},{type:"paragraph",text:"Skill dan level awal: ____  Target: ____  Bukti gap: ____  Aktivitas: ____  Mentor: ____  Tenggat: ____  Tes kasus baru: ____  Ukuran berhasil: ____  Hasil cek: ____  Keputusan lanjut: ____."},{type:"heading",text:"C Decision log dan change request"},{type:"paragraph",text:"Decision ID: ____  Task ID: ____  Versi awal: ____  Dua interpretasi: ____  Evidence: ____  Keputusan QA: ____  Owner: ____  Tanggal efektif: ____  Task terdampak: ____  Perlu rescore: ya / tidak. Contoh baru dan kontra: ____."},{type:"heading",text:"D Handover batch"},{type:"paragraph",text:"Batch dan scope: ____  Assigned: ____  Submitted: ____  Accepted: ____  Escalated: ____  Versi: ____  Metode sampling: ____  Hasil metrik dengan numerator/denominator: ____  Masalah belum selesai: ____  Tindakan dan owner: ____  Lokasi file final: ____  Penerima menyetujui pada: ____."},{type:"heading",text:"E Catatan sesi mentor"},{type:"paragraph",text:"Kasus yang dibawa: ____  Diagnosis dari evidence: ____  Latihan baru yang dicoba: ____  Feedback: ____  Satu perubahan perilaku: ____  Ukuran berhasil: ____  Waktu cek: ____  Status blocker: ____."},{type:"paragraph",text:"Versi CSV kosong untuk log dan scorecard tersedia dalam toolkit. Kolom sengaja menyimpan numerator dan denominator agar laporan dapat dihitung ulang; data contoh diberi penanda synthetic."}]},{title:"44 Rencana peluncuran 10 hari kerja",blocks:[{type:"table",rows:[["Hari","Tindakan konkret","Definition of done"],["1","L&D menetapkan scope, jam dan cohort","Parameter dan owner disetujui"],["2","QA dan owner meninjau 12 kompetensi","Target level per scope tercatat"],["3","Admin menyiapkan tool dan akses","Seluruh staf lolos tool check"],["4","Trainer menguji modul pada 3 calon peserta","Instruksi membingungkan direvisi"],["5","QA mengadjudikasi dataset dan quiz baru","Kunci berversi, unresolved dikeluarkan"],["6","Assessor mengerjakan 10 anchor blind","Perbedaan material terselesaikan"],["7","Peserta menjalankan baseline","Bukti dan missing data tercatat"],["8","L&D menetapkan track serta IDP","Setiap anggota tahu milestone"],["9","Mentor melakukan orientasi kelompok","Jadwal, SLA dan kanal dipahami"],["10","Mulai M01 dan terbitkan dashboard","Baseline cohort dan risiko tersedia"]]},{type:"heading",text:"Kondisi minimum sebelum mulai"},{type:"paragraph",text:"Satu owner program dan satu owner kualitas; guideline tersedia; kunci ditinjau minimal dua assessor; akses tool berhasil; data latihan sah digunakan; jam dukungan jelas; kapasitas feedback sesuai cohort; aturan assessment diumumkan. Jika belum ada audio berizin, jalankan P1 lebih dahulu sambil menyiapkan P2."},{type:"heading",text:"Risiko yang perlu dimiliki owner"},{type:"paragraph",text:"Trainee kehilangan akses internet: sediakan batch offline dan jadwal pengganti. Mentor overload: kecilkan ukuran batch. Gold keliru: rescore seluruh peserta terdampak. Terlalu banyak scope: fokus satu spesialisasi dulu. Data training mirip tes: pisahkan berdasarkan source group dan buat capstone baru. Kualitas turun setelah lulus: periksa perubahan task sebelum menyimpulkan skill hilang."}]},{title:"45 Referensi primer dan batas penerapan",blocks:[{type:"paragraph",text:"Referensi
